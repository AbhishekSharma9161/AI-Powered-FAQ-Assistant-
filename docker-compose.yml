version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: faq_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - faq-network

  server:
    build: ./server
    container_name: faq_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/ai-chatbot
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb
    networks:
      - faq-network

  client:
    build: ./client
    container_name: faq_client
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - server
    networks:
      - faq-network

volumes:
  mongo_data:

networks:
  faq-network:
    driver: bridge
